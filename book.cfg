% tex4ht configuration file for Book of Swarm
% Configures HTML5 output with MathJax, custom styling, and glossary handling
% Split output: one HTML file per chapter

\Preamble{xhtml,html5,mathjax,2,sec-filename,fn-in,charset=utf-8,next}

% Use custom CSS
\Configure{AddCss}{swarm-book.css}

% Configure document structure
\Configure{DOCTYPE}{\HCode{<!DOCTYPE html>\Hnewline}}
\Configure{HTML}{\HCode{<html lang="en" data-theme="light">\Hnewline}}{\HCode{\Hnewline</html>}}

% Add meta viewport for responsive design
\Configure{@HEAD}{\HCode{<meta name="viewport" content="width=device-width, initial-scale=1.0">\Hnewline}}
\Configure{@HEAD}{\HCode{<meta name="description" content="The Book of Swarm - Storage and communication infrastructure for a self-sovereign digital society">\Hnewline}}

% Theme toggle script inline
\Configure{@HEAD}{\HCode{<script>
(function() {
  var theme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>\Hnewline}}

% Configure figures
\ConfigureEnv{figure}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<figure class="book-figure">\Hnewline}}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</figure>\Hnewline}}
  {}{}

% Configure definition environment
\ConfigureEnv{definition}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<div class="definition">\Hnewline}}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</div>\Hnewline}}
  {}{}

% Configure theorem environment
\ConfigureEnv{theorem}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<div class="theorem">\Hnewline}}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</div>\Hnewline}}
  {}{}

% Configure labelledlist
\ConfigureEnv{labelledlist}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<dl class="labelled-list">\Hnewline}}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</dl>\Hnewline}}
  {}{}

% Configure centerverbatim
\ConfigureEnv{centerverbatim}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<pre class="center-verbatim">\Hnewline}}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</pre>\Hnewline}}
  {}{}

% Navigation - add to end of body
\Configure{@/BODY}{\HCode{
<nav class="book-nav">
  <button id="theme-toggle" aria-label="Toggle dark mode">
    <span class="theme-icon"></span>
  </button>
</nav>
<script src="theme-toggle.js"></script>
}}

\begin{document}
\EndPreamble
